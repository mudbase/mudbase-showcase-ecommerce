name: mudbase_showcase_ecommerce
description: >
  Flutter reimplementation of the Mudbase Showcase ecommerce storefront —
  catalog, cart, checkout with Mudbase Payment Links, order history, and a
  seller fulfillment dashboard, built entirely on the Mudbase BaaS.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # HTTP client - shared with the Mudbase SDK's own MudbaseSdk().dio instance
  dio: ^5.7.0

  # Mudbase Dart SDK (generated via OpenAPI Generator, built_value pattern).
  # Not published to pub.dev - resolved as a sibling checkout. `mobile-flutter/`
  # is one level inside the `mudbase-showcase-ecommerce` repo, so reaching a
  # flat sibling of that repo (mudbase-sdk cloned "next to it, at the same
  # parent level" - see README "Setup") takes exactly two `../` segments:
  # mobile-flutter/ -> mudbase-showcase-ecommerce/ -> <parent> -> mudbase-sdk/dart.
  mudbase_sdk:
    path: ../../mudbase-sdk/dart

  # Declared directly (not just pulled in transitively via mudbase_sdk)
  # because auth_service.dart imports `package:built_value/serializer.dart`
  # directly for `FullType` when building request bodies through the SDK's
  # own builder classes/serializers - same version constraint the SDK itself
  # uses, so there is no diamond-dependency conflict.
  built_value: '>=8.4.0 <9.0.0'

  # Secure token storage - Keychain (iOS) / EncryptedSharedPreferences (Android).
  # Never SharedPreferences for the auth token (project hard security rule).
  flutter_secure_storage: ^9.2.2

  # Date/money formatting
  intl: ^0.19.0

  # Product image loading with caching + placeholders
  cached_network_image: ^3.4.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
