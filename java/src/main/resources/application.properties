spring.application.name=mudbase-showcase-ecommerce-java
server.port=${PORT:8080}

# --- Mudbase project wiring ---------------------------------------------------
mudbase.base-url=${MUDBASE_URL:https://cloud.mudbase.dev}
mudbase.project-id=${MUDBASE_PROJECT_ID:}
mudbase.api-key=${MUDBASE_API_KEY:}
mudbase.products-collection-id=${MUDBASE_PRODUCTS_COLLECTION_ID:}
mudbase.orders-collection-id=${MUDBASE_ORDERS_COLLECTION_ID:}
mudbase.carts-collection-id=${MUDBASE_CARTS_COLLECTION_ID:}

# --- Checkout / payment-link proxy (the already-deployed Next.js app) ---------
checkout.proxy-base-url=${CHECKOUT_PROXY_BASE_URL:https://mudbase-showcase-ecommerce.vercel.app}

# --- This app's own public origin, used to build the payment redirectUrl ------
app.base-url=${APP_BASE_URL:http://localhost:8080}

# --- Thymeleaf ------------------------------------------------------------------
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}

# --- Sessions ---------------------------------------------------------------
server.servlet.session.timeout=30m

logging.level.dev.mudbase.showcase.ecommerce=INFO
