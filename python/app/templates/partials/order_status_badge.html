{% set status = order.order_status.value %}
{% if status in ("delivered", "paid") %}
  <span class="badge badge-success">{{ order.status_label }}</span>
{% elif status == "cancelled" %}
  <span class="badge badge-destructive">{{ order.status_label }}</span>
{% elif status in ("awaiting_payment", "pending") %}
  <span class="badge badge-warning">{{ order.status_label }}</span>
{% else %}
  <span class="badge badge-secondary">{{ order.status_label }}</span>
{% endif %}
